name: Import AOT binaries (one-shot)

on:
  push:
    branches:
      - codex/soul-header-status
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/soul-header-status
      - name: Download recorded AOT images artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/14508588785/zip > /tmp/aot-images.zip
          mkdir -p /tmp/aot-images
          unzip -q /tmp/aot-images.zip -d /tmp/aot-images
          ls /tmp/aot-images/*.o | wc -l
      - name: Install binaries and verify hashes
        run: |
          cp /tmp/aot-images/*.o aot/
          ls aot/*.o | wc -l
          sha256sum -c <<'EOF'
          cf456021bd9f2bed77cd50c608e5aa6039eb1c745264cb439c16cae4afa18a99  aot/aot_busybox.o
          fc953cf312bd560de5dba6ebd468bd5b3362b662d0db5ddb3c7aa0f385e325af  aot/aot_libcrypto.o
          92e25f7ad01a84867d6f82c4f828f68d31a319430b3aba9e1e183b189e35da9c  aot/aot_libjpeg.o
          783ee8ee6df2b003c037f17131abc483b9c94a9d685f7b70a6bbe9ec1216e231  aot/aot_libssl.o
          6839e3520f435d7679008b72c30dd62ac66f4892f0295ffd39b75f2c698da74e  aot/aot_libwebp.o
          8bb9b3c2724e155b222fcf015a6e9122fce050b76176565291c808b81cb7a2ea  aot/aot_musl.o
          3a2b67bc914a9a2cdefbd2dd3fec8df010e1631bdc6bb9ca3191d815fb4c50ea  aot/aot_numpy.o
          6c8b8f7ecb73e45c92ef7ac47db1512ae9262c80e759b33a564d4504ea5e17cf  aot/aot_pcre2.o
          65b8dd7ab791599e93efe02a28addcb3d216b454b56c3b1de5a9c186019c400e  aot/aot_pillow.o
          3fcd626fd9f52ba7d44643002753949c9ac7be118bbb6cd1c53f54c295a86868  aot/aot_pybinascii.o
          e5872c48943a0725dee1b0776503ab23a4f90339300d9445b751f4e98c1ca5ef  aot/aot_pyblake2.o
          f413cb6c2b3200a0c00aead6e4840dd53652f76d3a8c51cb57a2157d35f99936  aot/aot_pydatetime.o
          23d82db90e4300bb4b4e2e380945a6d83f56152d5e00957e5ec6dfe4d8754fd7  aot/aot_pyhashlib.o
          8a23f9e444eeee4c2791e8168d589fe89d7398af6255c102f5fc564641cdc544  aot/aot_pyjson.o
          aec376d87c9b16c05bf400f02ef3cc0c39ce133eb84e7004e9d020cb8831be50  aot/aot_pymath.o
          00eaacd8ff4b435dd89459323609d3ba4d03119ba61ae37b46a0ed69265d4483  aot/aot_pyselect.o
          38cb536cc8cfe84d34378070e55828077ec0258a7d83503195d6b60b79bbccfe  aot/aot_pysocket.o
          337a68c43e4ad3880b2b8ab1672a524fcc24cb04bb9db4d14d57b9cd3378b172  aot/aot_pystruct.o
          d6d3d5849acf735ccbb15711a90908fe0a03867a66ef7fbc7be2f895daae9731  aot/aot_python3.o
          113026659d1e7b127649a253dbdb28d4f64f0dea43d264adf1c58fe9d060d17c  aot/aot_pyzlib.o
          1d033f36e7e5fbcb90a306d2bb69f2f096b1810a3fc9d87de099e5f74b18b8a0  aot/aot_scp.o
          b66ac8a4e7779d69ea42f33a256d19af7d6d44921f6074889acbb77b0471972a  aot/aot_sqlite.o
          bdf632704f9ed9bc7fb4a8cb510c9bee66b845a863e40f6fdafa50f4c70c38ea  aot/aot_ssh.o
          77e6105219d4992af76baca5337ca8538f2e6240ac36de041b4934248afbd0b0  aot/aot_zlib.o
          EOF
      - name: Commit binaries and remove this workflow
        run: |
          rm .github/workflows/import-aot-binaries.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat(aojit): import the 24 re-recorded v3.21 AOT binaries (runs 28+30)"
          git push origin HEAD:codex/soul-header-status
