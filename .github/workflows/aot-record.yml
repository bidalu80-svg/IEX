name: Record AOT images

# Records one AOT image per library in scripts/aot-manifest.txt against a real
# Alpine rootfs and uploads them. These images are what makes AOJIT real: the
# app links them in and starts with the translations already present.
#
# Run this by hand when gen.c or a module version changes. It is deliberately
# NOT part of the app build: installing ~120 MB of packages inside the emulator
# takes the better part of an hour, and every IPA would wait for it.
#
# Download the `aot-images` artifact, drop the .o files into `aot/`, commit, and
# the normal build links them (see ZE_AOT_OBJECTS in build.yml).

env:
  ALPINE_BRANCH: v3.21
  ALPINE_RELEASE: "3.21.0"

on:
  workflow_dispatch:
    inputs:
      # [T-aot-family] Record from v3.21, then run the same workload in a rootfs
      # of this version. musl and busybox differ between releases, so any hit
      # here can only come from family + by_hash matching — which is exactly
      # what a device on a newer rootfs needs.
      cross_version:
        description: 'Alpine version to test the images against (family matching)'
        default: '3.19'
        required: false
  # [T-aot-trigger] `workflow_dispatch` only works once the workflow exists on
  # the DEFAULT branch, and this one lives on a feature branch. A push touching
  # this sentinel is the supported way to start it from here; ordinary pushes
  # never match the path filter.
  push:
    paths:
      - '.aot-record-trigger'

jobs:
  record:
    # Same image as the app build: macos-14's clang 15 rejects the tree's
    # _Atomic(function pointer) initialisers, and the images should be
    # produced by the toolchain that links them.
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        image: ["musl", "busybox", "python3", "nodejs", "pillow", "libwebp", "libjpeg", "numpy", "zlib", "sqlite", "libcrypto", "libssl", "pcre2", "ssh", "scp", "pyjson", "pyhashlib", "pyblake2", "pystruct", "pydatetime", "pybinascii", "pymath", "pyzlib", "pysocket", "pyselect"]
    steps:
      - uses: actions/checkout@v4

      - name: Preflight every pinned package against the live Alpine v3.21 indexes
        run: |
          set -euo pipefail
          rm -rf /tmp/aot-apkindex
          mkdir -p /tmp/aot-apkindex
          for repo in main community; do
            url="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/${repo}/aarch64/APKINDEX.tar.gz"
            echo "fetch $url"
            curl -fSL --retry 3 --retry-delay 2 -o "/tmp/aot-apkindex/$repo.tar.gz" "$url"
          done
          python3 - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path

          targets = json.loads(Path("scripts/aot-targets.json").read_text())["images"]
          pins = sorted({(target["package"], target["version"]) for target in targets})
          available = {}
          for repo in ("main", "community"):
              path = Path(f"/tmp/aot-apkindex/{repo}.tar.gz")
              with tarfile.open(path, mode="r:gz") as archive:
                  index = archive.extractfile("APKINDEX").read().decode("utf-8")
              for stanza in index.split("\n\n"):
                  fields = {}
                  for line in stanza.splitlines():
                      if len(line) > 2 and line[1] == ":":
                          fields[line[0]] = line[2:]
                  if fields.get("P") and fields.get("V"):
                      available.setdefault(fields["P"], set()).add(fields["V"])

          missing = []
          for package, version in pins:
              versions = available.get(package, set())
              if version not in versions:
                  shown = ", ".join(sorted(versions)) or "no versions"
                  missing.append(f"{package}={version} (index has: {shown})")
          if missing:
              print("::error::Pinned Alpine v3.21 packages are missing from the live indexes")
              for item in missing:
                  print(f"MISSING {item}")
              raise SystemExit(1)
          print(f"All {len(pins)} pinned package versions are present in {os.environ['ALPINE_BRANCH']}")
          PY

      - name: Fetch the pinned OpenMinis training suite
        uses: actions/checkout@v4
        with:
          repository: OpenMinis/ish-arm64
          ref: 0fd17a135e78b7a0cf08a4f5831217bbb76ed22f
          path: .aot-upstream

      - name: Install build tools
        run: |
          # lld is required: meson links the guest vdso with -fuse-ld=lld.
          for p in ninja libarchive pkg-config llvm lld; do
            brew list "$p" >/dev/null 2>&1 || brew install "$p"
          done
          python3 -m venv .venv
          .venv/bin/pip install --quiet meson

      - name: Build macOS ish with the JIT
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$(brew --prefix llvm)/bin:$(brew --prefix libarchive)/bin:$PATH"
          meson setup build-macos Vendor/ZeNative/ish \
            --buildtype=release \
            -Dlog='' \
            -Dkernel=ish \
            -Dengine=asbestos \
            -Dguest_arch=arm64 \
            -Djit=true
          ninja -C build-macos ish tools/fakefsify

      - name: Prepare rootfs
        run: |
          set -uo pipefail
          url="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/releases/aarch64/alpine-minirootfs-${ALPINE_RELEASE}-aarch64.tar.gz"
          echo "alpine=${ALPINE_BRANCH#v}"
          echo "url=$url"
          rm -f /tmp/alpine.tar.gz
          if ! curl -fSL --retry 3 --retry-delay 2 -o /tmp/alpine.tar.gz "$url"; then
            rc=$?
            echo "curl failed rc=$rc"
            ls -l /tmp/alpine.tar.gz 2>/dev/null || true
            exit 1
          fi
          ls -l /tmp/alpine.tar.gz
          rm -rf /tmp/rootfs
          mkdir -p /tmp/rootfs/tmp
          if ! tar -xzf /tmp/alpine.tar.gz -C /tmp/rootfs; then
            echo "tar failed"
            exit 1
          fi
          # /bin/sh is a symlink to the absolute path /bin/busybox, so testing
          # it from the host dereferences the RUNNER's /bin/busybox and fails.
          # The real file is what matters.
          ls -l /tmp/rootfs/bin/sh || true
          test -x /tmp/rootfs/bin/busybox || { echo "no executable busybox"; exit 1; }

      # [T-aot-install] `apk add` inside the emulator is slow (it decompresses
      # ~116 MB with an emulated xz), but it is the only path that reliably put
      # the files where the guest can run them. Two host-side attempts failed:
      # `apk fetch` wrote 116 MB of .apk that `tar -O data.tar.gz` could not
      # open, and a two-step extract still unpacked nothing. This runs once, by
      # hand, and the resulting images are committed — so the cost is paid here
      # and never in the app build.
      - name: Install the workload packages
        run: |
          set -uo pipefail
          rel="$(cut -d. -f1,2 /tmp/rootfs/etc/alpine-release)"
          [ "$rel" = "${ALPINE_BRANCH#v}" ] || { echo "rootfs is Alpine $rel, expected ${ALPINE_BRANCH#v}"; exit 1; }
          mkdir -p /tmp/rootfs/etc/apk
          printf 'https://dl-cdn.alpinelinux.org/alpine/%s/main\nhttps://dl-cdn.alpinelinux.org/alpine/%s/community\n' \
            "$ALPINE_BRANCH" "$ALPINE_BRANCH" > /tmp/rootfs/etc/apk/repositories
          # A fresh minirootfs has no resolver either; without one apk resolves
          # nothing and every fetch fails with "temporary error".
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /tmp/rootfs/etc/resolv.conf
          [ -s /tmp/rootfs/etc/hosts ] || printf '127.0.0.1 localhost\n' > /tmp/rootfs/etc/hosts

          # Exact pins from the recording target table, all from the live v3.21
          # index. openssh-server is the same 9.9_p2-r1 release as the pinned
          # openssh-client-default/common and provides the guest sshd.
          PKGS="$(python3 -c 'import json; d=json.load(open("scripts/aot-targets.json")); print(" ".join(sorted({x["package"]+"="+x["version"] for x in d["images"]})))') py3-requests git ripgrep pcre2-tools bzip2 openssh-server=9.9_p2-r1"
          echo "── apk add --no-cache $PKGS"
          build-macos/ish -r /tmp/rootfs /bin/sh -c "apk add --no-cache $PKGS" \
            || { echo "Exact training packages unavailable; stop without recording"; exit 1; }
          # realfs reports host ownership. sshd requires uid 0 on its privsep
          # directory, which an unprivileged macOS runner cannot set in-guest.
          if [ '${{ matrix.image }}' = ssh ] || [ '${{ matrix.image }}' = scp ]; then
            sudo install -d -o 0 -g 0 -m 755 /tmp/rootfs/var/empty \
              || { echo "Cannot prepare root-owned sshd privilege-separation directory"; exit 1; }
          fi
          echo "── installed:"
          ls -l /tmp/rootfs/usr/bin/python3 /tmp/rootfs/usr/bin/node 2>/dev/null || true
          ls /tmp/rootfs/usr/lib/python3*/site-packages 2>/dev/null | head -5 || true

      - name: Verify every installed target module against its pinned build-id
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("recorder", "scripts/record-aot.py")
          recorder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(recorder)
          targets = json.loads(Path("scripts/aot-targets.json").read_text())["images"]
          failures = []
          for target in targets:
              label = f"{target['id']} ({target['package']}={target['version']})"
              try:
                  actual = recorder.build_id(recorder.guest_file(Path("/tmp/rootfs"), target["path"]))
              except Exception as error:
                  failures.append(f"{label}: {error}")
                  continue
              if actual != target["build_id"]:
                  failures.append(f"{label}: expected {target['build_id']}, got {actual}")
          if failures:
              print("::error::Installed module identities do not match the pinned recording targets")
              for failure in failures:
                  print(f"MISMATCH {failure}")
              raise SystemExit(1)
          print(f"Verified all {len(targets)} target modules against their pinned build-ids")
          PY

      - name: Stage reference workloads and validate all exact identities
        run: |
          bash scripts/prepare-aot-workloads.sh build-macos/ish /tmp/rootfs .aot-upstream

      - name: Record one image with strict workload gates
        run: |
          set -euo pipefail
          python3 scripts/record-aot.py --ish build-macos/ish --root /tmp/rootfs --only "${{ matrix.image }}"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for f in .aot-new/recorded/*.S; do
            xcrun clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" -c "$f" -o "${f%.S}.o"
          done

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: aot-image-${{ matrix.image }}
          path: |
            .aot-new/recorded/*.S
            .aot-new/recorded/*.o
            .aot-new/recorded/VERSIONS.txt
            .aot-new/recorded/TARGETS.json
            .aot-new/recorded/RECORDED-*.json
            .aot-new/recorded/*.log
          if-no-files-found: error


  assemble:
    needs: record
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: aot-image-*
          merge-multiple: true
          path: .aot-new/recorded
      - name: Require the complete, exact 25-image recording set
        run: python3 scripts/check-aot-artifact.py .aot-new/recorded
      - name: Install build tools
        run: |
          # lld is required: meson links the guest vdso with -fuse-ld=lld.
          for p in ninja libarchive pkg-config llvm lld; do
            brew list "$p" >/dev/null 2>&1 || brew install "$p"
          done
          python3 -m venv .venv
          .venv/bin/pip install --quiet meson

      - name: Build macOS ish with the JIT
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$(brew --prefix llvm)/bin:$(brew --prefix libarchive)/bin:$PATH"
          meson setup build-macos Vendor/ZeNative/ish \
            --buildtype=release \
            -Dlog='' \
            -Dkernel=ish \
            -Dengine=asbestos \
            -Dguest_arch=arm64 \
            -Djit=true
          ninja -C build-macos ish tools/fakefsify

      - name: Prepare rootfs
        run: |
          set -uo pipefail
          url="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}/releases/aarch64/alpine-minirootfs-${ALPINE_RELEASE}-aarch64.tar.gz"
          echo "alpine=${ALPINE_BRANCH#v}"
          echo "url=$url"
          rm -f /tmp/alpine.tar.gz
          if ! curl -fSL --retry 3 --retry-delay 2 -o /tmp/alpine.tar.gz "$url"; then
            rc=$?
            echo "curl failed rc=$rc"
            ls -l /tmp/alpine.tar.gz 2>/dev/null || true
            exit 1
          fi
          ls -l /tmp/alpine.tar.gz
          rm -rf /tmp/rootfs
          mkdir -p /tmp/rootfs/tmp
          if ! tar -xzf /tmp/alpine.tar.gz -C /tmp/rootfs; then
            echo "tar failed"
            exit 1
          fi
          # /bin/sh is a symlink to the absolute path /bin/busybox, so testing
          # it from the host dereferences the RUNNER's /bin/busybox and fails.
          # The real file is what matters.
          ls -l /tmp/rootfs/bin/sh || true
          test -x /tmp/rootfs/bin/busybox || { echo "no executable busybox"; exit 1; }

      - name: Verify core rootfs module identities
        run: |
          python3 - <<'PYCODE'
          import importlib.util, json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('recorder', 'scripts/record-aot.py')
          recorder = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(recorder)
          for target in recorder.TARGETS['images']:
              if target['id'] in ('musl', 'busybox'):
                  assert recorder.build_id(recorder.guest_file(Path('/tmp/rootfs'), target['path'])) == target['build_id'], target['id']
          PYCODE

      - name: Verify the images attach and hit
        # [T-aot-verify] Recording only proves gen.py ran. This links two of
        # the images into the same macOS CLI and runs a workload with the JIT
        # unable to translate (ISH_JIT_AOT_ONLY): if the images do not attach,
        # /bin/true still finishes in the interpreter but the stats line shows
        # 0 AOT and 0 images. A non-zero "AOT n (2 images)" is the proof the
        # app needs — the app reads the same two counters.
        # [T-aojit-v2] No longer continue-on-error: this is the only proof the
        # images attach to *this* engine, and a silently skipped check once let
        # a build ship with 24 unusable images.
        run: |
          set -uo pipefail
          export PATH="$PWD/.venv/bin:$(brew --prefix llvm)/bin:$(brew --prefix libarchive)/bin:$PATH"
          meson configure build-macos \
            -Dcli_aot="$PWD/.aot-new/recorded/aot_musl.S,$PWD/.aot-new/recorded/aot_busybox.S"
          ninja -C build-macos ish
          out=$(ISH_JIT_AOT_ONLY=1 ISH_JIT_STATS=1 build-macos/ish -r /tmp/rootfs \
                  /bin/sh -c 'for i in $(seq 200); do /bin/true; done; echo workload-ok' 2>&1)
          echo "$out" | tail -6
          echo "$out" | grep -q 'workload-ok' || { echo "❌ the workload did not finish"; exit 1; }
          echo "$out" | grep -Eq 'AOT [1-9][0-9]* \(2 images\)' || { echo "❌ the images attached but never hit"; exit 1; }
          { echo '### AOT self-check'; echo '```'; echo "$out" | tail -6; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify a different rootfs still hits (family matching)
        # [T-aot-family] The images were recorded from v3.21. This runs them
        # against cross_version: different musl, different busybox, no
        # build-id match anywhere. Blocks that still come from the images are
        # the proof that by_hash serves another version of the same file.
        run: |
          set -uo pipefail
          v="${{ github.event.inputs.cross_version || '3.19' }}"
          url="https://dl-cdn.alpinelinux.org/alpine/v${v}/releases/aarch64/alpine-minirootfs-${v}.0-aarch64.tar.gz"
          echo "── cross rootfs: alpine $v"
          curl -fSL --retry 3 -o /tmp/alpine-cross.tar.gz "$url"
          rm -rf /tmp/rootfs-cross
          mkdir -p /tmp/rootfs-cross/tmp
          tar -xzf /tmp/alpine-cross.tar.gz -C /tmp/rootfs-cross

          # Build-id is what the engine matches first: printing both proves the
          # hits below cannot come from IMG_SAME, only from IMG_FAMILY.
          # llvm-readelf comes with the llvm that meson already needs.
          bid() { llvm-readelf -n "$1" | sed -n 's/.*Build ID: //p' | head -1; }
          echo "── recorded against: $(grep -E '^(musl|busybox)-' .aot-new/recorded/VERSIONS.txt | tr '\n' ' ')"
          echo "── running on:      $(build-macos/ish -r /tmp/rootfs-cross /bin/sh -c 'apk info -v musl busybox 2>/dev/null | grep -E "^(musl|busybox)-"' | tr '\n' ' ')"
          echo "── musl build-id recorded: $(bid /tmp/rootfs/lib/ld-musl-aarch64.so.1)"
          echo "── musl build-id cross:    $(bid /tmp/rootfs-cross/lib/ld-musl-aarch64.so.1)"

          out=$(ISH_JIT_AOT_ONLY=1 ISH_JIT_STATS=1 build-macos/ish -r /tmp/rootfs-cross \
                  /bin/sh -c 'for i in $(seq 200); do /bin/true; done; echo workload-ok' 2>&1)
          echo "$out" | tail -6
          echo "$out" | grep -q 'workload-ok' || { echo "❌ the cross-version workload did not finish"; exit 1; }
          echo "$out" | grep -Eq 'AOT [1-9][0-9]* \(2 images\)' \
            || { echo "❌ a different rootfs version got no hits at all: family matching is not working"; exit 1; }
          { echo '### Cross-version (family) self-check'; echo '```'; echo "$out" | tail -6; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: aot-images
          path: .aot-new/recorded/
          if-no-files-found: error
