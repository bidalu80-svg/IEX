name: Record AOT images

# Records one AOT image per library in scripts/aot-manifest.txt against a real
# Alpine rootfs and uploads them. These images are what makes AOJIT real: the
# app links them in and starts with the translations already present.
#
# Run this by hand when gen.c or a module version changes. It is deliberately
# NOT part of the app build: installing ~120 MB of packages inside the emulator
# takes the better part of an hour, and every IPA would wait for it.
#
# Download the `aot-images` artifact, drop the .o files into `aot/`, commit, and
# the normal build links them (see ZE_AOT_OBJECTS in build.yml).

on:
  workflow_dispatch:
    inputs:
      alpine_version:
        description: 'Alpine minirootfs version'
        default: '3.21'
        required: false
  # [T-aot-trigger] `workflow_dispatch` only works once the workflow exists on
  # the DEFAULT branch, and this one lives on a feature branch. A push touching
  # this sentinel is the supported way to start it from here; ordinary pushes
  # never match the path filter.
  push:
    paths:
      - '.aot-record-trigger'

jobs:
  record:
    # Same image as the app build: macos-14's clang 15 rejects the tree's
    # _Atomic(function pointer) initialisers, and the images should be
    # produced by the toolchain that links them.
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # lld is required: meson links the guest vdso with -fuse-ld=lld.
          for p in ninja libarchive pkg-config llvm lld; do
            brew list "$p" >/dev/null 2>&1 || brew install "$p"
          done
          python3 -m venv .venv
          .venv/bin/pip install --quiet meson

      - name: Build macOS ish with the JIT
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$(brew --prefix llvm)/bin:$(brew --prefix libarchive)/bin:$PATH"
          meson setup build-macos Vendor/ZeNative/ish \
            --buildtype=release \
            -Dlog='' \
            -Dkernel=ish \
            -Dengine=asbestos \
            -Dguest_arch=arm64 \
            -Djit=true
          ninja -C build-macos ish tools/fakefsify

      - name: Prepare rootfs
        run: |
          set -uo pipefail
          v="${{ github.event.inputs.alpine_version || '3.21' }}"
          url="https://dl-cdn.alpinelinux.org/alpine/v${v}/releases/aarch64/alpine-minirootfs-${v}.0-aarch64.tar.gz"
          echo "alpine=$v"
          echo "url=$url"
          rm -f /tmp/alpine.tar.gz
          if ! curl -fSL --retry 3 --retry-delay 2 -o /tmp/alpine.tar.gz "$url"; then
            rc=$?
            echo "curl failed rc=$rc"
            ls -l /tmp/alpine.tar.gz 2>/dev/null || true
            exit 1
          fi
          ls -l /tmp/alpine.tar.gz
          rm -rf /tmp/rootfs
          mkdir -p /tmp/rootfs/tmp
          if ! tar -xzf /tmp/alpine.tar.gz -C /tmp/rootfs; then
            echo "tar failed"
            exit 1
          fi
          # /bin/sh is a symlink to the absolute path /bin/busybox, so testing
          # it from the host dereferences the RUNNER's /bin/busybox and fails.
          # The real file is what matters.
          ls -l /tmp/rootfs/bin/sh || true
          test -x /tmp/rootfs/bin/busybox || { echo "no executable busybox"; exit 1; }

      # [T-aot-install] `apk add` inside the emulator is slow (it decompresses
      # ~116 MB with an emulated xz), but it is the only path that reliably put
      # the files where the guest can run them. Two host-side attempts failed:
      # `apk fetch` wrote 116 MB of .apk that `tar -O data.tar.gz` could not
      # open, and a two-step extract still unpacked nothing. This runs once, by
      # hand, and the resulting images are committed — so the cost is paid here
      # and never in the app build.
      - name: Install the workload packages
        run: |
          set -uo pipefail
          rel="$(cut -d. -f1,2 /tmp/rootfs/etc/alpine-release)"
          mkdir -p /tmp/rootfs/etc/apk
          printf 'https://dl-cdn.alpinelinux.org/alpine/v%s/main\nhttps://dl-cdn.alpinelinux.org/alpine/v%s/community\n' \
            "$rel" "$rel" > /tmp/rootfs/etc/apk/repositories
          # A fresh minirootfs has no resolver either; without one apk resolves
          # nothing and every fetch fails with "temporary error".
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > /tmp/rootfs/etc/resolv.conf
          [ -s /tmp/rootfs/etc/hosts ] || printf '127.0.0.1 localhost\n' > /tmp/rootfs/etc/hosts

          PKGS="python3 nodejs py3-pillow py3-numpy git openssh-client-default pcre2-tools bzip2"
          echo "── apk add --no-cache $PKGS"
          build-macos/ish -r /tmp/rootfs /bin/sh -c "apk add --no-cache $PKGS" \
            || echo "⚠️  apk add failed; only libraries already present can record"
          echo "── installed:"
          ls -l /tmp/rootfs/usr/bin/python3 /tmp/rootfs/usr/bin/node 2>/dev/null || true
          ls /tmp/rootfs/usr/lib/python3*/site-packages 2>/dev/null | head -5 || true

      - name: Record AOT images
        run: |
          set -uo pipefail
          mkdir -p aot
          SUMMARY="$RUNNER_TEMP/aot-summary.txt"
          : > "$SUMMARY"
          while IFS='|' read -r name module workload timeout; do
            case "$name" in ''|'#'*) continue ;; esac
            case "$workload" in
              @*) cp "${workload#@}" "/tmp/rootfs/tmp/wl-$name.sh" ;;
              *)  printf '%s\n' "$workload" > "/tmp/rootfs/tmp/wl-$name.sh" ;;
            esac
            limit="${timeout:-240}"
            echo "=== $name ($module, ${limit}s) ==="
            # A guest workload can hang (V8 startup under emulation does), and
            # record.sh has no deadline of its own. macOS has no coreutils
            # `timeout`, so perl's alarm+exec does the same job.
            if perl -e 'alarm shift; exec @ARGV' "$limit" \
                 Vendor/ZeNative/ish/tools/jit_aot/record.sh \
                 build-macos/ish /tmp/rootfs "/tmp/wl-$name.sh" "aot/aot_$name.S" "$module"; then
              size=$(wc -c < "aot/aot_$name.S" 2>/dev/null || echo 0)
              printf '%-12s %10s bytes\n' "$name" "$size" >> "$SUMMARY"
            else
              printf '%-12s %s\n' "$name" "NO IMAGE" >> "$SUMMARY"
              echo "❌ record failed for $name"
            fi
          done < scripts/aot-manifest.txt

          echo "── summary"
          cat "$SUMMARY"
          { echo '### AOT images'; echo '```'; cat "$SUMMARY"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for f in aot/*.S; do
            [ -f "$f" ] || continue
            xcrun clang -arch arm64 -miphoneos-version-min=16.0 -isysroot "$SDK" -c "$f" -o "${f%.S}.o" || true
          done
          ls -lh aot/ || true

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: aot-images
          path: |
            aot/*.S
            aot/*.o
          if-no-files-found: warn
