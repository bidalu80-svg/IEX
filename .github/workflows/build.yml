name: Build iOS App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Minis.app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version
          ls /Applications | grep Xcode

      - name: Create ProviderCustomization.xcconfig
        run: cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Create stub scripts for CI
        run: |
          SCRIPTS_DIR="$(pwd)/../../scripts"
          mkdir -p "$SCRIPTS_DIR"
          cat > "$SCRIPTS_DIR/gen_debug_skill.sh" << 'GENEOF'
#!/bin/bash
OUT="${SRCROOT:-$PWD}/Generated/DebugSkillGenerated.swift"
mkdir -p "$(dirname "$OUT")"
cat > "$OUT" << 'STUBEOF'
#if DEBUG
enum DebugSkillGenerated {
    static let skillMarkdownB64 = ""
    static let clientPythonB64 = ""
    static let clientNodeB64 = ""
    static let clientBashB64 = ""
}
#endif
STUBEOF
GENEOF
          chmod +x "$SCRIPTS_DIR/gen_debug_skill.sh"
          mkdir -p Generated
          cat > Generated/DebugSkillGenerated.swift << 'GENEOF'
#if DEBUG
enum DebugSkillGenerated {
    static let skillMarkdownB64 = ""
    static let clientPythonB64 = ""
    static let clientNodeB64 = ""
    static let clientBashB64 = ""
}
#endif
GENEOF

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Minis.xcodeproj \
            -scheme Minis \
            -clonedSourcePackagesDirPath .spm

      - name: Build (Debug, no signing)
        run: |
          xcodebuild build \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination generic/platform=iOS \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
