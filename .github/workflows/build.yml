name: Build iOS App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Minis.app
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Create ProviderCustomization.xcconfig
        run: cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Minis.xcodeproj \
            -scheme Minis \
            -clonedSourcePackagesDirPath .spm

      - name: Build (Debug, no signing)
        run: |
          xcodebuild build \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
