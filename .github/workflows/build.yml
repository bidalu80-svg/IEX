name: Build iOS App

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Minis.app
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Create ProviderCustomization.xcconfig
        run: cp Configs/ProviderCustomization.xcconfig.example Configs/ProviderCustomization.xcconfig

      - name: Create stub deps
        shell: bash
        run: |
          ROOT="$PWD"
          UP1="$(pwd)/.."
          UP2="$(pwd)/../.."

          # scripts/ is referenced as $SRCROOT/../../scripts/ (2 levels up)
          mkdir -p "$UP2/scripts"
          echo '' | base64 -d > "$UP2/scripts/gen_debug_skill.sh"
          chmod +x "$UP2/scripts/gen_debug_skill.sh"

          # shared/ is referenced as ../shared/ (1 level up)
          mkdir -p "$UP1/shared/bashism"
          echo '[]' > "$UP1/shared/bashism/bashism_rules.json"
          echo '[]' > "$UP1/shared/bashism/bashism_test_vectors.json"

          # Generated/ is inside the repo
          mkdir -p "$ROOT/Generated"
          printf '#if DEBUG\nenum DebugSkillGenerated {\n    static let skillMarkdownB64 = ""\n    static let clientPythonB64 = ""\n    static let clientNodeB64 = ""\n    static let clientBashB64 = ""\n}\n#endif\n' > "$ROOT/Generated/DebugSkillGenerated.swift"

          # deps/ + build/ are referenced as ../../deps/ and ../../build/ (2 levels up)
          mkdir -p "$UP2/deps/include/ish"
          mkdir -p "$UP2/deps/include/fs"
          mkdir -p "$UP2/deps/include/kernel"
          printf '%s\n' \
            '#ifndef NATIVE_OFFLOAD_H' \
            '#define NATIVE_OFFLOAD_H' \
            'typedef int (*native_offload_handler_t)(int argc, char **argv, int stdin_fd, int stdout_fd, int stderr_fd);' \
            'int native_offload_add_handler(const char *name, native_offload_handler_t handler);' \
            '#endif' \
            > "$UP2/deps/include/kernel/native_offload.h"
          # stub kernel/fs.h (referenced by NativeOffloadUtils.m)
          printf '%s\n' \
            '#ifndef KERNEL_FS_H' \
            '#define KERNEL_FS_H' \
            '#define O_RDONLY_ 0' \
            '#define O_WRONLY_ 1' \
            '#define O_CREAT_ 64' \
            '#define O_TRUNC_ 512' \
            '#define O_NONBLOCK 2048' \
            '#define O_APPEND_ 1024' \
            '#define AT_PWD (-100)' \
            '#define S_IFCHR 0020000' \
            '#define TTY_CONSOLE_MAJOR 4' \
            '#define TTY_ALTERNATE_MAJOR 5' \
            '#define DEV_TTY_MINOR 0' \
            '#define DEV_CONSOLE_MINOR 1' \
            '#define DEV_PTMX_MINOR 2' \
            '#define MEM_MAJOR 1' \
            '#define DEV_NULL_MINOR 3' \
            '#define DEV_ZERO_MINOR 5' \
            '#define DEV_FULL_MINOR 7' \
            '#define DEV_RANDOM_MINOR 8' \
            '#define DEV_URANDOM_MINOR 9' \
            '#define TTY_PSEUDO_SLAVE_MAJOR 136' \
            '#endif' \
            > "$UP2/deps/include/kernel/fs.h"
          # stub fs/fd.h
          printf '%s\n' \
            '#ifndef FS_FD_H' \
            '#define FS_FD_H' \
            'struct fd;' \
            'struct fd *generic_open(const char *path, int flags, int mode);' \
            'void fd_close(struct fd *fd);' \
            '#define IS_ERR(p) ((unsigned long)(p) >= (unsigned long)-4095)' \
            '#endif' \
            > "$UP2/deps/include/fs/fd.h"
          # stub fs/path.h
          printf '%s\n' \
            '#ifndef FS_PATH_H' \
            '#define FS_PATH_H' \
            'int generic_mkdirat(int dirfd, const char *path, int mode);' \
            'int generic_mknodat(int dirfd, const char *path, int mode, int dev);' \
            'int dev_make(int major, int minor);' \
            'int create_stdio(const char *path, int major, int num);' \
            '#endif' \
            > "$UP2/deps/include/fs/path.h"
          # stub ish/kernel/fs.h → replicate kernel/fs.h
          mkdir -p "$UP2/deps/include/ish/kernel"
          cp "$UP2/deps/include/kernel/fs.h" "$UP2/deps/include/ish/kernel/fs.h"
          # stub ish/fs/
          mkdir -p "$UP2/deps/include/ish/fs"
          cp "$UP2/deps/include/fs/fd.h" "$UP2/deps/include/ish/fs/fd.h"
          cp "$UP2/deps/include/fs/path.h" "$UP2/deps/include/ish/fs/path.h"
          echo 'I2lmbmRlZiBJU0hfSAojZGVmaW5lIElTSF9ICiNpbmNsdWRlIDxzdGRpbnQuaD4KI2luY2x1ZGUgPHN0ZGJvb2wuaD4KI2luY2x1ZGUgPHN5cy90eXBlcy5oPgpzdHJ1Y3QgdGNiOwpzdHJ1Y3QgdGFzazsKc3RydWN0IG1vdW50OwojZW5kaWY=' | base64 -d > "$UP2/deps/include/ish/ish.h"
          echo 'I2lmbmRlZiBERVZJQ0VTX0gKI2RlZmluZSBERVZJQ0VTX0gKI2VuZGlm' | base64 -d > "$UP2/deps/include/fs/devices.h"
          for f in kernel.h emu.h interrupt.h task.h thread.h; do touch "$UP2/deps/include/ish/$f"; done

          mkdir -p "$UP2/deps/libs"
          for lib in lish_emu lish lfakefs; do touch "$UP2/deps/libs/lib${lib}.a"; done

          for fw in slirp.0 ffi.8 gmodule-2.0.0 pixman-1.0 zstd.1 iconv.2 gio-2.0.0 intl.8 gthread-2.0.0 qemu-aarch64-softmmu gobject-2.0.0 glib-2.0.0 jpeg.62 gstnet-1.0.0 opus.0 gstcheck-1.0.0 gstcontroller-1.0.0 png16.16 json-glib-1.0.0 gcrypt.20 virglrenderer.1 gstbase-1.0.0 ssl.1.1 gstrtsp-1.0.0 EGL gstreamer-1.0.0 gstsdp-1.0.0 epoxy.0 crypto.1.1 gstvideo-1.0.0 swtpm.0 phodav-3.0.0 gstfft-1.0.0 gstaudio-1.0.0 gstpbutils-1.0.0 gstallocators-1.0.0 gstapp-1.0.0 gpg-error.0 gstrtp-1.0.0 gstriff-1.0.0 GLESv2 gsttag-1.0.0 soup-3.0.0; do
            mkdir -p "$UP2/build/frameworks/$fw.framework"
          done

          for fw in FFmpeg libavcodec libavformat libavutil libavfilter libswresample libswscale; do
            mkdir -p "$UP2/deps/frameworks/$fw.framework/Headers"
          done

          mkdir -p "$UP2/deps/resources"
          touch "$UP2/deps/resources/RootfsPatch.bundle"
          touch "$UP2/deps/resources/alpine-rootfs.zip"

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Minis.xcodeproj \
            -scheme Minis \
            -clonedSourcePackagesDirPath .spm

      - name: Build (Debug, no signing)
        run: |
          xcodebuild build \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Debug \
            -destination generic/platform=iOS \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
